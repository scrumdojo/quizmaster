    <polygon points="32,64 36,34 28,34"/>
    <polygon points="0,32 30,28 30,36"/>
    <polygon points="64,32 34,28 34,36"/>
    <polygon points="9,9 30,28 26,32 28,26"/>
    <polygon points="55,55 34,36 38,32 36,38"/>
    <polygon points="55,9 36,28 32,26 38,30"/>
    <polygon points="9,55 28,36 32,38 26,34"/>
  </g>
</svg>
